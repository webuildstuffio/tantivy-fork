---
name: Unit tests

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

# Ensures that we cancel running jobs for the same PR / same workflow.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}  # yamllint disable-line rule:line-length
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v7

      - name: Install nightly
        uses: dtolnay/rust-toolchain@master
        with:
          # Pinned: the fmt gate runs on nightly rustfmt, whose output
          # drifts with every nightly release. A floating nightly
          # re-breaks `check` on unrelated PRs (e.g. Dependabot bumps).
          # Re-pin deliberately and re-run `cargo fmt --all` with the
          # pinned toolchain. (dtolnay/rust-toolchain replaces the
          # archived actions-rs/toolchain.)
          toolchain: nightly-2026-09-23
          components: rustfmt

      - name: Install stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo +nightly-2026-09-23 fmt --all -- --check

      - name: Check Stable Compilation
        run: cargo build --locked --all-features

      - name: Fetch benchmark fixtures
        # benches/index-bench.rs and benches/analyzer.rs use include_str!
        # on these data files. They are not committed to the fork
        # (upstream-only data files), so bench compilation fails without
        # them. Fetched from upstream main.
        run: |
          mirror="https://raw.githubusercontent.com"
          mirror="$mirror/quickwit-oss/tantivy/main/benches"
          for f in hdfs.json gh.json wiki.json alice.txt; do
            curl -sSL -o "benches/$f" "$mirror/$f"
          done
          ls -la benches/*.json benches/*.txt

      - name: Check Bench Compilation
        run: >
          cargo +nightly-2026-09-23 bench --locked --no-run
          --profile=dev --all-features

      - name: Check Clippy
        # actions-rs/clippy-check was archived; run clippy directly.
        run: cargo +stable clippy --locked --tests

  test:
    runs-on: ubicloud-standard-2
    strategy:
      matrix:
        features:
          - label: all
            flags: >-
              mmap,stopwords,lz4-compression,zstd-compression,failpoints,stemmer
          - label: quickwit
            flags: mmap,quickwit,failpoints
          - label: none
            flags: ""
    name: test-${{ matrix.features.label }}
    steps:
      - uses: actions/checkout@v7

      - name: Install stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: |
          # if matrix.feature.flags is empty then run on --lib to avoid
          # compiling examples (as most of them rely on mmap) otherwise
          # run all
          if [ -z "${{ matrix.features.flags }}" ]; then
            cargo +stable nextest run --locked --lib --no-default-features \
              --verbose --workspace
          else
            cargo +stable nextest run --locked \
              --features ${{ matrix.features.flags }} \
              --no-default-features --verbose --workspace
          fi

      - name: Run doctests
        run: |
          # if matrix.feature.flags is empty then run on --lib to avoid
          # compiling examples (as most of them rely on mmap) otherwise
          # run all
          if [ -z "${{ matrix.features.flags }}" ]; then
            echo "no doctest for no feature flag"
          else
            cargo +stable test --locked --doc \
              --features ${{ matrix.features.flags }} \
              --verbose --workspace
          fi
